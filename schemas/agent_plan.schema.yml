$schema: https://json-schema.org/draft/2020-12/schema
$id: rmw.agent-plan.v2
title: RMW Agent Plan v2
type: object
required: [version, plan_id, project, version_id, workflow, registry_digest, plan_hash, tasks]
properties:
  version:
    const: 2
  plan_id:
    type: string
    minLength: 1
  project:
    type: string
    minLength: 1
  version_id:
    type: string
    minLength: 1
  workflow:
    type: string
    minLength: 1
  registry_digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
  plan_hash:
    type: string
    pattern: '^[0-9a-f]{64}$'
  tasks:
    type: array
    items:
      type: object
      required: [task_id, depends_on, invocation, invocation_hash, derived_metadata]
      properties:
        task_id:
          type: string
          minLength: 1
        depends_on:
          type: array
          items: {type: string}
        invocation:
          type: object
          required: [tool_name, params, project, version_id]
          properties:
            tool_name: {type: string, minLength: 1}
            params: {type: object}
            project: {type: string, minLength: 1}
            version_id: {type: string, minLength: 1}
          additionalProperties: false
        invocation_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        derived_metadata:
          type: object
          required: [action_id, permission, requires_approval, allowed_for_auditor, execution_semantics, approval_type]
additionalProperties: true
