name: advisor_request
version: 2
required_fields:
  - version
  - request_id
  - type
  - status
  - project
  - version_id
  - task_id
  - action_id
  - tool_name
  - attempt_id
  - invocation_hash
  - context_hash
  - context_manifest
  - round
  - request_hash
  - reason
  - question
  - command
  - command_hash
  - expected_response
  - created_at
type_values:
  - tuning_plan_required
  - failure_diagnosis_required
  - data_gap_decision_required
  - product_decision_required
status_values:
  - pending
  - answered
  - rejected
  - consumed
  - waiting_for_user
field_notes:
  request_id: Stable id for this Advisor request inside one version workspace.
  type: The kind of judgment needed from the embedded reasoning layer or human expert.
  attempt_id: Agent action attempt bound to this request.
  invocation_hash: Bound tool invocation hash used to reject stale answers.
  context_hash: Canonical hash of the immutable reasoning Context Pack.
  context_pack: Required for version 2; absent for legacy version 1 requests. Workspace-relative content-addressed Context Pack snapshot.
  context_manifest: Compatibility alias for context_pack; no longer a live glob expansion.
  round: Advisor round, such as LLM tuning round.
  request_hash: Canonical hash of request identity fields.
  context_files: Informational provenance patterns only; never authoritative after request creation.
  constraints: Guardrails the Advisor response must respect.
  expected_response.type: Required response type accepted by rmw agent advisor accept.
  command_hash: Hash of the blocked command to prevent stale or mismatched answers.
