suite: harness
version: 1
scenarios:
  - name: local_happy_path
    fixture: tests/agent_scenarios/test_local_happy_path.py::test_agent_local_happy_path_closes_strict_audit_after_advisor_pause
    expected_transitions: [draft_to_waiting_for_advisor, waiting_for_advisor_to_done]
    expected_blockers: [advisor_required]
    expected_artifacts: [agent_plan.yml, audit/agent_state.yml, audit/agent_trace.jsonl, reports/model_report.md]
    expected_audit_verdict: complete
    forbidden_runner_calls: []
    expected_trace_events: [action_result_attempt_pair]
    tags: [terminal_happy_path]

  - name: sql_approve
    fixture: tests/test_agent_sql_approval_flow.py::test_agent_prepare_approval_consume_execute_is_exactly_bound
