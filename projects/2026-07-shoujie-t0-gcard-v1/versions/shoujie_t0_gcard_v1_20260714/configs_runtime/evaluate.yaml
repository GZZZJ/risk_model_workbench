evaluation:
  label_column: is_14_fq
  score_columns:
  - model_score
  - v1_score
  score_labels:
    model_score: 本轮模型
  split_column: final_flag
  time_column: mdl_dte
  period_column: mdl_dte
  segment_columns:
  - blue_customer_flag
  - zc_level
  - sample_label
  - credit_limit
  comparison_dimensions:
  - sample_label
  risk_profile_dimensions:
  - sample_label
  - credit_limit
metrics:
- auc
- ks
- decile_lift
- ranking_inversion
- psi
- business_risk
risk_observation:
  enabled: true
  columns:
  - prc_amt_xz_30d_3m
  - ovd_amt_xz_30d_3m
runtime_step_params:
  auc_ks: {}
  baseline_importance_filter:
    importance_type: gain
    keep_top_n: 500
  champion_challenger: {}
  constant_value_filter:
    max_unique_values: 1
  correlation_dedup:
    method: spearman
    max_abs_corr: 0.8
  cross_gain_matrix:
    bins: 8
  decile_lift:
    bins: 10
  feature_availability_filter: {}
  feature_gain_summary: {}
  feature_metadata_export: {}
  feature_quality_prescreen:
    require_sql_approval: true
  field_contract: {}
  iv_filter:
    min_iv: 0.005
  key_uniqueness: {}
  lightgbm_binary_training:
    early_stopping_rounds: 50
    max_auc_gap: 0.03
  llm_guided_tuning:
    max_rounds: 2
    candidates_per_round: 4
    max_trials: 8
    objective:
      primary_metric: valid_ks
      secondary_metric: valid_auc
    guardrails:
      max_train_valid_auc_gap: 0.03
    advisor:
      mode: host_agent
      fallback_to_heuristic: false
  missing_rate_filter:
    threshold: 0.9
  model_report: {}
  monthly_label_distribution:
    min_samples_per_month: 50
  monthly_stability:
    min_samples: 50
  null_importance_filter:
    null_rounds: 20
    null_percentile: 75
    score_threshold: 1.0
  psi_filter:
    max_psi: 0.2
  score_psi:
    bins: 10
    warn_psi: 0.2
  score_psi_bin_detail:
    bins: 10
  segment_distribution: {}
  segment_metrics: {}
  wide_sql_generation: {}
