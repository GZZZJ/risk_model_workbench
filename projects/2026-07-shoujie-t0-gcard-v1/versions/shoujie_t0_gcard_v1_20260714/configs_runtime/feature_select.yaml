feature_select:
  engine: feature-select-v2
  mode: local_file
  skill_path: ../../vendor/feature-select-v2
  output_dir: runs/{run_id}/feature_select
  metadata:
    tables_file: configs/feature_tables.txt
    output_dir: data/profile/feature_metadata
    docs_path: docs/特征表清单.md
    sample_columns: []
    exclude_columns: []
  prescreen:
    feature_columns: data/profile/feature_metadata/feature_columns.csv
    output_dir: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/feature_selection/prescreen
    target_col: is_14_fq
    split_col: final_flag
    train_value: DEV_INS
    valid_value: OOT
    round_num: 500
    random_seed: 0
    workers: 4
    sampling:
      partition_col: mdl_dte
      train_partitions: []
      valid_partitions: []
      where: sample_month is not null and final_flag in ('DEV','OOT') and target in
        (0,1)
    dp_feather:
      data_dir: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/data/dp_feather/feature_prescreen
      metadata_dir: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/feature_selection/dp_feather_datasets/feature_prescreen
    thresholds:
      empty: 0.9
      iv: 0.005
      psi: 0.2
      corr: 0.8
  wide_table:
    base_table: null
    output_table: ''
    join_keys:
    - uid
    - mdl_dte
    base_columns:
    - uid
    - mdl_dte
    - sample_month
    - target
    - final_flag
    base_where: sample_month is not null
    feature_where: sample_month is not null
    remain_features_path: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/feature_selection/prescreen/results/prescreen_final_remain_features.json
    sql_output: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/queries/06_build_prescreen_wide_table.sql
    feature_map_output: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/feature_selection/prescreen_wide_feature_map.csv
    summary_output: /root/notebook/自动化建模/risk-model-workbench/projects/2026-07-shoujie-t0-gcard-v1/versions/shoujie_t0_gcard_v1_20260714/feature_selection/wide_sql_summary.json
  steps:
  - d01
  - d02
  - d03
  - d05
  - d07
  - d08
  thresholds:
    iv: 0.005
    empty: 0.9
    corr: 0.8
    psi: 0.2
  feature_info:
    table_or_path: ''
    required_columns:
    - feature_name
    - feature_comment
    - category_name
  bigtable:
    tables: []
    local_files: []
  params:
    D01_PARAMS:
      random_num: 3000000
      random_seed: 0
    D02_PARAMS:
      random_num: 5000000
      random_seed: 0
    D03_D06_PARAMS:
      ins_random_num: 3000000
      oos_random_num: 1000000
      random_seed: 0
    D07_D08_PARAMS:
      random_num: 5000000
      random_seed: 0
  train_baseline_model: true
  runtime_request:
    data_source_mode: local_feather
    sample_location: /root/notebook/首借G卡/五百维特征样本.feather
    stage_steps:
      sample_check:
      - field_contract
      - key_uniqueness
      - monthly_label_distribution
      - segment_distribution
      feature_refine:
      - feature_availability_filter
      - missing_rate_filter
      - constant_value_filter
      - iv_filter
      - psi_filter
      - correlation_dedup
      - null_importance_filter
      - baseline_importance_filter
      train_baseline:
      - lightgbm_binary_training
      - llm_guided_tuning
      evaluate:
      - auc_ks
      - decile_lift
      - monthly_stability
      - score_psi
      - score_psi_bin_detail
      - segment_metrics
      - cross_gain_matrix
      - feature_gain_summary
      compare:
      - champion_challenger
      report:
      - model_report
      feature_metadata:
      - feature_metadata_export
      feature_prescreen:
      - feature_quality_prescreen
      build_wide_sql:
      - wide_sql_generation
    step_params:
      auc_ks: {}
      baseline_importance_filter:
        importance_type: gain
        keep_top_n: 500
      champion_challenger: {}
      constant_value_filter:
        max_unique_values: 1
      correlation_dedup:
        method: spearman
        max_abs_corr: 0.8
      cross_gain_matrix:
        bins: 8
      decile_lift:
        bins: 10
      feature_availability_filter: {}
      feature_gain_summary: {}
      feature_metadata_export: {}
      feature_quality_prescreen:
        require_sql_approval: true
      field_contract: {}
      iv_filter:
        min_iv: 0.005
      key_uniqueness: {}
      lightgbm_binary_training:
        early_stopping_rounds: 50
        max_auc_gap: 0.03
      llm_guided_tuning:
        max_rounds: 2
        candidates_per_round: 4
        max_trials: 8
        objective:
          primary_metric: valid_ks
          secondary_metric: valid_auc
        guardrails:
          max_train_valid_auc_gap: 0.03
        advisor:
          mode: host_agent
          fallback_to_heuristic: false
      missing_rate_filter:
        threshold: 0.9
      model_report: {}
      monthly_label_distribution:
        min_samples_per_month: 50
      monthly_stability:
        min_samples: 50
      null_importance_filter:
        null_rounds: 20
        null_percentile: 75
        score_threshold: 1.0
      psi_filter:
        max_psi: 0.2
      score_psi:
        bins: 10
        warn_psi: 0.2
      score_psi_bin_detail:
        bins: 10
      segment_distribution: {}
      segment_metrics: {}
      wide_sql_generation: {}
