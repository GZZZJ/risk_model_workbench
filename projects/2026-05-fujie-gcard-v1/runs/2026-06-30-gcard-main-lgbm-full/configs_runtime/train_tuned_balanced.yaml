training:
  default_algorithm: lightgbm
  random_seed: 50
  feature_list_path: /Users/guzijun/Desktop/AI攻坚/risk_model_workbench/projects/2026-05-fujie-gcard-v1/runs/2026-06-30-gcard-main-lgbm-full/feature_selection/final_features.txt
  label_column: ftr_30d_ord_flag
  split_column: final_flag
  train_values:
  - DEV
  valid_values:
  - DEV-OOS
  oos_values:
  - DEV-OOS
  - OOT
  - OOT-OOS
  experiments:
  - name: main_lgbm_tuned_balanced
    display_name: 复借G卡主模型调参 balanced challenger
    segment: all
    segment_filter: null
    algorithm: lightgbm
    method: lightgbm
    description: 调参搜索第8组，目标为 DEV/DEV-OOS/OOT/OOT-OOS AUC/KS 相对原模型整体提升
    sample_weight: null
  candidate_targets:
  - ftr_30d_ord_flag
  sample_variants:
  - all
  - e2e3
  - b2
  runtime_step_params:
    feature_quality_prescreen:
      require_sql_approval: true
    sql_review_gate:
      block_on_high_risk: true
    missing_rate_filter:
      threshold: 0.9
    constant_value_filter:
      max_unique_values: 1
    iv_filter:
      min_iv: 0.005
    correlation_dedup:
      method: spearman
      max_abs_corr: 0.8
    null_importance_filter:
      null_rounds: 20
      null_percentile: 75
      score_threshold: 1.0
    baseline_importance_filter:
      importance_type: gain
      keep_top_n: 500
    lightgbm_binary_training:
      early_stopping_rounds: 50
      max_auc_gap: 0.02
input:
  feather_path: /Users/guzijun/gcard_1pct_export/sample_50pct.feather
  id_columns:
  - uid
  - mdl_dte
  base_columns:
  - uid
  - mdl_dte
  - ds
  - final_flag
  - blue_customer_flag
  - zc_level
  - ftr_30d_ord_flag
  - ftr_30d_ord_amt
  - prc_amt_xz_30d_3m
  - ovd_amt_xz_30d_3m
  - rand_flag0
  - gcard_v2
  - gcard_v4
  - gcard_v5
  - gcard_v6
  label_column: ftr_30d_ord_flag
  split_column: final_flag
  historical_score_columns:
  - gcard_v2
  - gcard_v4
  - gcard_v5
  - gcard_v6
preprocessing:
  missing_sentinels:
  - -999
  - -998
  min_non_null_rate: 0.01
  drop_constant: true
lightgbm:
  objective: binary
  metric: auc
  learning_rate: 0.0284730863414912
  num_leaves: 63
  max_depth: 7
  min_child_samples: 75
  subsample: 0.7020237451220523
  colsample_bytree: 0.7331205209651076
  reg_alpha: 1.1618308562813377e-05
  reg_lambda: 0.0103814092507735
  num_boost_round: 900
  early_stopping_rounds: 80
  bagging_freq: 2
