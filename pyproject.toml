[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-model-workbench"
version = "0.1.0"
description = "Risk scenario AI modeling workbench."
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
modeling = [
  "pandas",
  "pyarrow",
  "scikit-learn",
  "lightgbm",
  "xgboost",
  "jinja2",
  "matplotlib",
]
agent-openai = [
  "langchain-openai>=1.0,<2.0",
]
agent-anthropic = [
  "langchain-anthropic>=1.6,<1.7",
]

[project.scripts]
rmw = "risk_model_workbench.cli:main"
jm = "risk_model_workbench.cli:main"
jingying-agent = "risk_model_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risk_model_workbench = ["reporting/assets/*.css", "reporting/assets/*.js"]
